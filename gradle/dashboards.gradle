    group = 'verification'
    description = 'Runs one suite and writes actual path lengths into ' +
            'src/test/resources/scenarios/expected-lengths/<suite>.json. ' +
            'Options: dashboardSuite (default: routes), ' +
            'dashboardFilter (capture only scenarios whose name or category contains it), ' +
            'dashboardProfile (default: auto — off above 200 scenarios; pass true/false to force), ' +
            'dashboardHeatmap (default: true), ' +
            'dashboardThreads (parallel scenario workers, default: availableProcessors()-3).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include 'shortestpath/dashboard/DashboardTest.class'
    ignoreFailures = true
    reports {
        junitXml.required = false
        html.required = false
    }
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging.showStandardStreams = true
    systemProperty 'dashboard.outputRoot', dashboardOutputRoot.get().asFile.absolutePath
    systemProperty 'dashboard.bundleName', dashboardBundle.get()
    systemProperty 'dashboard.suite', dashboardSuite.get()
    systemProperty 'dashboard.backend', dashboardBackend.get()
    if (!dashboardDataset.get().isEmpty()) {
        systemProperty 'dashboard.dataset', file(dashboardDataset.get()).absolutePath
    }
    if (!dashboardFilter.get().isEmpty()) {
        systemProperty 'dashboard.filter', dashboardFilter.get()
    }
    if (!dashboardTier.get().isEmpty()) {
        systemProperty 'dashboard.tier', dashboardTier.get()
    }
    systemProperty 'corpus.dir', rootProject.file('corpus').absolutePath
    if (!dashboardProfile.get().isEmpty()) {
        systemProperty 'dashboard.profile', dashboardProfile.get()
    }
    systemProperty 'dashboard.heatmap', dashboardHeatmap.get()
    systemProperty 'dashboard.f2p', dashboardF2p.get()
    systemProperty 'dashboard.sourceResourcesDir', sourceSets.test.resources.srcDirs.first().absolutePath
    if (!dashboardTitle.get().isEmpty()) {
        systemProperty 'dashboard.title', dashboardTitle.get()
    }
    if (!dashboardSubtitle.get().isEmpty()) {
        systemProperty 'dashboard.subtitle', dashboardSubtitle.get()
    }
    if (!dashboardThreads.get().isEmpty()) {
        systemProperty 'dashboard.threads', dashboardThreads.get()
    }
}


// Prints every suite's scenarios as JSON; maintenance.py and import_issues.py read suites from it.
tasks.register('scenarioIndex', JavaExec) {
    group = 'help'
    description = 'Prints the scenario index: {suite: [{name, category, profile, tiers, description}]}.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'shortestpath.scenarios.Suites'
    systemProperty 'corpus.dir', rootProject.file('corpus').absolutePath
}
