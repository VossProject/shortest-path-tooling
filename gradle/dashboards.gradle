// --- Dashboards ---

def dashboardOutputRoot = layout.buildDirectory.dir('reports/pathfinder-dashboard')
// A committed suite (shortestpath.scenarios.Suites), or a route JSON file to run instead.
def dashboardSuite = providers.gradleProperty('dashboardSuite')
        .orElse('routes')
def dashboardDataset = providers.gradleProperty('dashboardDataset')
        .orElse('')
// legacy or A* pathfinder (A* runs unprofiled).
def dashboardBackend = providers.gradleProperty('dashboardBackend')
        .orElse('legacy')
// Run only the scenarios tagged with this tier (the canonical suite's smoke/standard/full).
def dashboardTier = providers.gradleProperty('dashboardTier')
        .orElse('')
// Run only the scenarios whose name or category contains this text (ignoring case).
def dashboardFilter = providers.gradleProperty('dashboardFilter')
        .orElse('')
def dashboardSubtitle = providers.gradleProperty('dashboardSubtitle')
        .orElse('')
// Empty when not set: the test then auto-decides profiling by dataset size.
def dashboardProfile = providers.gradleProperty('dashboardProfile')
        .orElse('')
def dashboardHeatmap = providers.gradleProperty('dashboardHeatmap')
        .orElse('true')
def dashboardSeasonal = providers.gradleProperty('dashboardSeasonal')
        .orElse('false')
def dashboardF2p = providers.gradleProperty('dashboardF2p')
        .orElse('false')
def dashboardThreads = providers.gradleProperty('dashboardThreads')
        .orElse('')
// Derive bundle name and title from the suite (or file) name + profile flag.
// e.g. suite=clue-locations-full, profile=true
//   → bundle: clue-locations-full-profiled, title: Clue Locations Full Profiled
// Override with -PdashboardBundle=... or -PdashboardTitle=...
def profiled = dashboardProfile.get() == 'true'
def backendSlug = dashboardBackend.get().equalsIgnoreCase('LEGACY')
        ? '' : '-' + dashboardBackend.get().toLowerCase()
def sourceStem = { String source ->
    def filename = source.tokenize('/').last()
    (filename.contains('.') ? filename.substring(0, filename.lastIndexOf('.')) : filename) +
            (dashboardTier.get().isEmpty() ? '' : '_' + dashboardTier.get())
}
def bundleFor = { String source ->
    def slug = sourceStem(source).replace('_', '-').toLowerCase()
    profiled ? "${slug}${backendSlug}-profiled" : "${slug}${backendSlug}"
}
def titleFor = { String source ->
    sourceStem(source).tokenize('_-').collect { it.capitalize() }.join(' ') +
            (backendSlug.isEmpty() ? '' : ' ' + dashboardBackend.get().toLowerCase().capitalize()) +
            (profiled ? ' Profiled' : '')
}
def dashboardSource = dashboardDataset.get().isEmpty() ? dashboardSuite.get() : dashboardDataset.get()
def dashboardBundle = providers.gradleProperty('dashboardBundle')
        .orElse(bundleFor(dashboardSource))
def dashboardTitle = providers.gradleProperty('dashboardTitle')
        .orElse(titleFor(dashboardSource))
// Built alongside the default suite when neither -PdashboardSuite nor -PdashboardDataset is given (see sailingDashboard)
def sailingSuite = 'sailing-routes'

def logDashboardLocation = { String taskName ->
    logger.lifecycle("")
    logger.lifecycle("${taskName} dashboard written.")
    logger.lifecycle("Serve it locally with:")
    logger.lifecycle("  python -m http.server --directory ${dashboardOutputRoot.get().asFile.absolutePath} 8000")
    logger.lifecycle("Then open: http://localhost:8000")
}

// Runs DashboardTest for one suite (or route file), publishing it as one bundle of the shared site
// options override the -P settings for this bundle: profile, seasonal, subtitle.
def configureDashboard = { Test task, String suite, String dataset, String bundle, String title, Map options = [:] ->
    task.doNotTrackState('Dashboard always re-runs to pick up the latest dataset and config.')
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.useJUnit()
    task.include 'shortestpath/dashboard/DashboardTest.class'
    task.ignoreFailures = true
    task.reports.junitXml.required = false
    task.reports.html.required = false
    task.jvmArgs = ['-Xms1g', '-Xmx8g']
    task.testLogging.showStandardStreams = true
    task.systemProperty 'dashboard.outputRoot', dashboardOutputRoot.get().asFile.absolutePath
    task.systemProperty 'dashboard.bundleName', bundle
    task.systemProperty 'dashboard.suite', suite
    task.systemProperty 'dashboard.backend', dashboardBackend.get()
    if (!dataset.isEmpty()) {
        task.systemProperty 'dashboard.dataset', file(dataset).absolutePath
    }
    if (!dashboardFilter.get().isEmpty()) {
        task.systemProperty 'dashboard.filter', dashboardFilter.get()
    }
    if (!dashboardTier.get().isEmpty()) {
        task.systemProperty 'dashboard.tier', dashboardTier.get()
    }
    task.systemProperty 'corpus.dir', rootProject.file('corpus').absolutePath
    def profile = options.profile != null ? options.profile.toString() : dashboardProfile.get()
    if (!profile.isEmpty()) {
        task.systemProperty 'dashboard.profile', profile
    }
    task.systemProperty 'dashboard.heatmap', dashboardHeatmap.get()
    task.systemProperty 'dashboard.seasonal', options.seasonal != null ? options.seasonal.toString() : dashboardSeasonal.get()
    task.systemProperty 'dashboard.f2p', dashboardF2p.get()
    if (!title.isEmpty()) {
        task.systemProperty 'dashboard.title', title
    }
    def subtitle = options.subtitle != null ? options.subtitle : dashboardSubtitle.get()
    if (!subtitle.isEmpty()) {
        task.systemProperty 'dashboard.subtitle', subtitle
    }
    if (!dashboardThreads.get().isEmpty()) {
        task.systemProperty 'dashboard.threads', dashboardThreads.get()
    }
}

tasks.register('dashboard', Test) {
    description = 'Builds the pathfinder dashboard from DashboardTest scenarios: the routes suite and, through ' +
            'sailingDashboard, the sailing routes (only the one given with -PdashboardSuite or -PdashboardDataset). ' +
            'Options (all via -P): dashboardSuite (default: routes; see shortestpath.scenarios.Suites), ' +
            'dashboardDataset (a route JSON file to run instead of a suite), ' +
            'dashboardFilter (run only scenarios whose name or category contains it), ' +
            'dashboardTier (run only scenarios with this tier tag, e.g. smoke), ' +
            'dashboardBackend (legacy or astar; default legacy), ' +
            'dashboardBundle, dashboardTitle, dashboardSubtitle, dashboardProfile ' +
            '(default: auto — on for datasets up to 200 scenarios, off above; ' +
            'pass true/false to force), ' +
            'dashboardHeatmap (default: true; only applies when profiling is on — ' +
            'set false to skip the per-tile visit map that dominates profiling ' +
            'memory on big datasets), ' +
            'dashboardSeasonal (default: false; tags the bundle so the frontend renders the ' +
            'Demonic Pacts League regions overlay), ' +
            'dashboardF2p (default: false; tags the bundle so the frontend tints members-only chunks), ' +
            'dashboardThreads (parallel scenario workers, default: availableProcessors()-3).'
    configureDashboard(it, dashboardSuite.get(), dashboardDataset.get(), dashboardBundle.get(), dashboardTitle.get())
    if (!providers.gradleProperty('dashboardSuite').isPresent() && dashboardDataset.get().isEmpty()) {
        // Sailing first, so the default routes are the newest bundle and still the one the site opens on
        dependsOn 'sailingDashboard'
    }
    doLast { logDashboardLocation('dashboard') }
}

tasks.register('sailingDashboard', Test) {
    description = 'Builds the sailing routes bundle of the pathfinder dashboard from the ' + sailingSuite + ' suite. ' +
            'Its scenarios also run the experimental sailing search when the plugin checkout has it. ' +
            'Takes the same -P options as dashboard, except the suite, dataset, bundle and title.'
    configureDashboard(it, sailingSuite, '', bundleFor(sailingSuite), titleFor(sailingSuite))
    doLast { logDashboardLocation('Sailing') }
}

// The site the plugin publishes to GitHub Pages (Skretzo/shortest-path dashboard-pages.yml runs
// pagesSite). Change the published bundles here, not in that workflow. The bundle picker lists the
// newest bundle first, so they build in reverse of how the picker shows them: seasonal at the bottom,
// routes at the top.
def pagesBundles = [
    [suite: 'seasonal-briefcase-routes', bundle: 'seasonal-briefcase', title: 'Seasonal — Demonic Pacts League',
     options: [seasonal: true, subtitle: 'Briefcase teleports + region unlock varbits']],
    [suite: 'collision-map-issues'],
    [suite: 'clue-locations-full', options: [profile: false]],
    [suite: 'quetzal-whistle-routes'],
    [suite: 'unit-tests'],
    [suite: sailingSuite],
    [suite: 'routes'],
]
def previousPagesBundle = null
def pagesBundleTasks = pagesBundles.collect { spec ->
    def name = 'pagesBundle' + spec.suite.tokenize('-').collect { it.capitalize() }.join('')
    def after = previousPagesBundle
    def task = tasks.register(name, Test) {
        description = 'Builds the ' + spec.suite + ' bundle of the published site (part of pagesSite).'
        configureDashboard(it, spec.suite, '', spec.bundle ?: bundleFor(spec.suite), spec.title ?: titleFor(spec.suite),
                spec.options ?: [:])
        if (after != null) {
            mustRunAfter after
        }
    }
    previousPagesBundle = task
    task
}
tasks.register('pagesSite') {
    group = 'verification'
    description = 'Builds every bundle of the dashboard site the plugin publishes to GitHub Pages, into ' +
            'build/reports/pathfinder-dashboard.'
    dependsOn pagesBundleTasks
    doLast { logDashboardLocation('Pages site') }
}

tasks.register('sailingBenchmark', Test) {
    doNotTrackState('The benchmark always re-runs.')
    group = 'verification'
    description = 'Times the experimental sailing search against the existing search on routes at sea. ' +
            'Needs a plugin with the sailing search, e.g. -PshortestPathDir=../shortest-path. ' +
            'Options (all via -P): sailingBenchmarkSuite (default: ' + sailingSuite + '), ' +
            'sailingBenchmarkSpeeds (default: 1.5,3.0), sailingBenchmarkBoats (default: none,raft,skiff,sloop), ' +
            'sailingBenchmarkWarmup (default: 2), sailingBenchmarkRounds (default: 5). ' +
            'Writes build/reports/sailing-benchmark/<suite>.md and .json.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include 'shortestpath/dashboard/SailingBenchmarkTest.class'
    reports {
        junitXml.required = false
        html.required = false
    }
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging.showStandardStreams = true
    systemProperty 'sailingBenchmark.run', 'true'
    systemProperty 'sailingBenchmark.outputDir', layout.buildDirectory.dir('reports/sailing-benchmark').get().asFile.absolutePath
    systemProperty 'corpus.dir', rootProject.file('corpus').absolutePath
    ['suite', 'speeds', 'boats', 'warmup', 'rounds'].each { option ->
        def value = providers.gradleProperty('sailingBenchmark' + option.capitalize())
        if (value.isPresent()) {
            systemProperty 'sailingBenchmark.' + option, value.get()
        }
    }
    doFirst {
        if (!pluginHasSailing) {
            throw new GradleException('The plugin checkout has no sailing search; point -PshortestPathDir at one that does, ' +
                    'e.g. -PshortestPathDir=../shortest-path')
        }
    }
}

tasks.register('captureExpectedLengths', Test) {
