// --- Benchmarks ---
//
// The canonical routes are this checkout's corpus/, like the canonical accounts are its accounts/:
// tests, benchmark and route all read them there (corpus.dir).
def corpusDir = rootProject.file('corpus')

def git = { File directory, List<String> arguments ->
    def output = new ByteArrayOutputStream()
    try {
        def result = exec {
            commandLine(['git', '-C', directory.absolutePath] + arguments)
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        if (result.exitValue == 0) {
            return output.toString('UTF-8').trim()
        }
    } catch (Exception ignored) {
        // Source archives and non-Git checkouts still run; provenance is reported as unknown.
    }
    return null
}
def commitOf = { File directory -> git(directory, ['rev-parse', 'HEAD']) ?: 'unknown' }
def dirtyOf = { File directory -> !(git(directory, ['status', '--porcelain']) ?: '').isEmpty() }

tasks.named('test') {
    systemProperty 'corpus.dir', corpusDir.absolutePath
}

// Runs the scenarios of a benchmark manifest (format 2: suite and scenario names) in one JVM and
// writes their results. collisionlab/osrs-benchmarks passes the arguments with --args.
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs a benchmark manifest\'s scenarios in one Java process: --args="--manifest M --output OUT".'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'shortestpath.benchmark.BenchmarkMain'
    jvmArgs = ['-Xms1g', '-Xmx8g']
    systemProperty 'corpus.dir', corpusDir.absolutePath
    doFirst {
        File plugin = gradle.ext.shortestPathProjectDir
        systemProperty 'benchmark.toolingCommit', commitOf(rootProject.projectDir)
        systemProperty 'benchmark.toolingDirty', dirtyOf(rootProject.projectDir).toString()
        systemProperty 'benchmark.shortestPathCommit', commitOf(plugin)
        systemProperty 'benchmark.shortestPathDirty', dirtyOf(plugin).toString()
    }
}

// Runs one canonical route for one account profile and prints the selected path.
tasks.register('route', JavaExec) {
    group = 'verification'
    description = 'Runs one route query and prints its selected path: a canonical route, coordinates, ' +
            'or a suite scenario (-ProuteSuite=SUITE -ProuteScenario="NAME", or -ProuteSuite=SUITE ' +
            '-ProuteArgs=--list).'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'shortestpath.route.RouteCli'
    systemProperty 'corpus.dir', corpusDir.absolutePath
    def routeArgs = providers.gradleProperty('routeArgs')
    // Passed as single arguments, so scenario names may contain spaces.
    def routeSuite = providers.gradleProperty('routeSuite')
    def routeScenario = providers.gradleProperty('routeScenario')
    doFirst {
        if (!routeArgs.isPresent() && !routeSuite.isPresent()) {
            throw new GradleException('route requires -ProuteArgs="PROFILE START_X START_Y START_PLANE TARGET_X TARGET_Y TARGET_PLANE" or -ProuteSuite=SUITE -ProuteScenario="NAME"')
        }
        def parsed = routeArgs.isPresent() ? (routeArgs.get().trim().split(/\s+/) as List) : []
        if (routeSuite.isPresent()) {
            parsed += ['--suite', routeSuite.get()]
        }
        if (routeScenario.isPresent()) {
            parsed += ['--scenario', routeScenario.get()]
        }
        args parsed
    }
}
