name: Update submodule

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: update-submodule
  cancel-in-progress: false

jobs:
  update:
    name: Update shortest-path submodule
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest master
        run: git submodule update --remote shortest-path

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shortest-path
          if git diff --cached --quiet; then
            echo "Submodule already up to date, nothing to commit."
          else
            COMMIT=$(git -C shortest-path rev-parse --short HEAD)
            git commit -m "chore: update shortest-path submodule to ${COMMIT}"
            git push
          fi
