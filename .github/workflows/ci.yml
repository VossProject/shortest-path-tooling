name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile test sources
        run: ./gradlew compileTestJava --stacktrace
        shell: bash

      - name: Test the account model
        # The account compiler and the canonical accounts.
        run: ./gradlew :accounts:test --stacktrace
        shell: bash

      - name: Check the scenario suites and profiles
        # Loads every suite (Java and route data), compiles the Java suites' accounts, and
        # tests the profiles, the runner's frontends and the CLI.
        run: >-
          ./gradlew :test --stacktrace
          --tests 'shortestpath.scenarios.*' --tests 'shortestpath.profiles.*'
          --tests 'shortestpath.benchmark.*' --tests 'shortestpath.route.*'
          --tests 'shortestpath.dashboard.ConfigParityTest'
        shell: bash

      - name: Run a light benchmark through the adapter
        # Runs benchmarkCanonical as shortest-path-benchmarks does (two cases, legacy and A*)
        # and checks the output as the harness reads it, so we know the adapter still works for it.
        # If you change the adapter's arguments, manifest format or output, update
        # shortest-path-benchmarks to match (projects/shortest-path/run.sh, scripts/lib/benchlib.py,
        # schemas/) and scripts/benchmark_smoke.py with it.
        run: python3 scripts/benchmark_smoke.py
        shell: bash

  validate:
    name: Validate data + Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          # The validate leaf checks enumerate committed plugin data via
          # git -C shortest-path ls-files — an empty submodule dir breaks them.
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run Python test suite
        run: python3 -m pytest tests/ -x

      - name: Validate committed data
        # Deterministic checks only — freshness needs the upstream
        # remote plus network, drift needs a local cache/, and verify
        # runs the Gradle dashboard sweep; all stay local-only.
        run: python3 scripts/maintenance.py validate --skip-freshness
